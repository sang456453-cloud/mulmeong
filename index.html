<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노을 바닷가 · 물멍하는 곳</title>
<meta name="description" content="파도 소리를 들으며 잠시 쉬어가는 온라인 물멍 공간. 수영, 물수제비, 발 담그기, 소원배, 심호흡.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{--ink:#fff4ea;--muted:rgba(255,244,234,.7);--panel:rgba(32,18,42,.5);--accent:#ff9b6a;--line:rgba(255,244,234,.2)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1a3a;color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;transition:opacity 1.4s}
.ui>*{pointer-events:auto}
.serif{font-family:"Gowun Batang",Pretendard,serif}
.brand{position:absolute;left:20px;top:max(16px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.brand svg{width:34px;height:34px;color:var(--accent)}
.brand b{display:block;font-family:"Gowun Batang",serif;font-size:19px;letter-spacing:0;color:var(--ink)}
.topright{position:absolute;right:16px;top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.count{font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;backdrop-filter:blur(6px)}
.count:empty{display:none}
/* 물수제비 순위판 */
.board{position:absolute;left:20px;top:calc(max(16px,env(safe-area-inset-top)) + 54px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;backdrop-filter:blur(8px);min-width:170px}
.board h3{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--ink);font-family:"Gowun Batang",serif}
.board ol{margin:0;padding:0;list-style:none}
.board li{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.board li.me{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;backdrop-filter:blur(6px);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.iconbtn[aria-pressed=false]{opacity:.45}
.iconbtn[aria-pressed=false] svg{stroke-dasharray:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* 행동: 오른쪽 세로 줄 — 동그란 버튼이 가는 선으로 이어짐 */
.rail{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;padding:8px 0}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--line) 15%,var(--line) 85%,transparent);transform:translateX(-50%)}
.rail button{position:relative;width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .2s,background .2s}
.rail button small{position:absolute;right:62px;top:50%;transform:translateY(-50%);font-size:11px;white-space:nowrap;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:4px 9px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.rail button:hover,.rail button:focus-visible{transform:scale(1.08);border-color:var(--accent);outline:none}
.rail button:hover small,.rail button:focus-visible small{opacity:1}
.rail button[aria-pressed=true]{background:var(--accent);color:#2b1408;border-color:var(--accent);box-shadow:0 0 0 6px rgba(255,155,106,.18)}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:14px;opacity:0;transition:opacity .5s;white-space:nowrap;backdrop-filter:blur(6px)}
.toast.on{opacity:1}
.hint{position:absolute;left:20px;bottom:max(14px,env(safe-area-inset-bottom));margin:0;font-size:11px;color:var(--muted);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.links{position:absolute;right:20px;bottom:max(14px,env(safe-area-inset-bottom));margin:0;font-size:12px;display:flex;gap:14px}
.links a{color:var(--muted)}
/* 입장: 왼쪽 아래 글 */
.gate{position:fixed;inset:0;display:flex;align-items:flex-end;background:linear-gradient(to top,rgba(14,8,24,.9),rgba(14,8,24,.15) 55%);transition:opacity .9s}
.gate.off{opacity:0;pointer-events:none}
.intro{padding:0 24px calc(max(28px,env(safe-area-inset-bottom)) + 16px);max-width:600px}
.intro small{letter-spacing:.24em;font-size:11px;color:var(--muted)}
.intro h1{margin:10px 0 8px;font-size:60px;line-height:1.05;font-weight:700;letter-spacing:-.01em;font-family:"Gowun Batang",serif}
.intro h1::after{content:"";display:block;width:56px;height:2px;background:var(--accent);margin-top:14px}
.intro h1+p{margin:0 0 22px;color:var(--muted);font-size:16px;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;margin-bottom:18px;font-size:13px;color:var(--muted)}
.row b{color:var(--accent);font-weight:500;margin-left:4px}
.row button{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:12px;margin-left:6px}
.row label{display:flex;gap:6px;align-items:center;cursor:pointer}
.enter{display:inline-flex;align-items:center;gap:14px;padding:16px 26px;border:0;border-radius:999px;background:var(--accent);color:#2b1408;font-size:16px;font-weight:600;cursor:pointer}
/* 심호흡 */
.breath{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(14,8,24,.55);cursor:pointer}
.breath.on{display:flex}
.breath .circle{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,155,106,.9),rgba(255,155,106,.15) 70%);transform:scale(.6);transition:transform 4s ease-in-out}
.breath p{margin:28px 0 0;font-size:18px}
.breath small{color:var(--muted);margin-top:8px}
/* 소원 적기 */
.ask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(14,8,24,.55);padding:16px}
.ask.on{display:flex}
.ask form{width:min(380px,100%);background:rgba(32,18,42,.92);border:1px solid var(--line);border-radius:22px;padding:24px 22px 18px;backdrop-filter:blur(10px)}
.ask h3{margin:0 0 14px;font-size:17px;font-weight:600}
.ask input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font-size:15px;outline:none}
.ask input:focus{border-color:var(--accent)}
.ask p{margin:10px 0 16px;font-size:12px;color:var(--muted)}
.ask .btns{display:flex;gap:8px;justify-content:flex-end}
.ask .btns button{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:14px}
.ask .btns button[type=submit]{background:var(--accent);color:#2b1408;border-color:var(--accent);font-weight:600}
@media (max-width:640px){
 .intro h1{font-size:40px}
 .rail{right:auto;left:50%;top:auto;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 30px);transform:translateX(-50%);flex-direction:row;gap:8px;padding:0}
 .rail::before{left:0;right:0;top:50%;bottom:auto;height:1px;width:auto;transform:translateY(-50%);background:linear-gradient(to right,transparent,var(--line) 15%,var(--line) 85%,transparent)}
 .rail button{width:50px;height:50px}
 .rail button small{right:auto;top:auto;bottom:-22px;left:50%;transform:translateX(-50%);opacity:1;background:none;border:0;padding:0;font-size:10px;color:var(--muted)}
 .rail button[aria-pressed=true] small{color:var(--accent)}
 .toast{bottom:112px;font-size:13px;white-space:normal;text-align:center;max-width:82%}
 .hint{left:50%;transform:translateX(-50%);bottom:max(6px,env(safe-area-inset-bottom));font-size:10px;white-space:nowrap}
 .links{right:16px;left:auto;bottom:auto;top:calc(max(14px,env(safe-area-inset-top)) + 48px);flex-direction:column;align-items:flex-end;gap:6px}
 .board{font-size:11px;min-width:150px;padding:8px 10px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="gate" id="gate">
 <div class="intro">
  <small>WAVES · A PLACE TO DRIFT</small>
  <h1>노을 바닷가</h1>
  <p>파도 소리를 들으며,<br>아무것도 하지 않아도 되는 시간.</p>
  <div class="row">
   <div>오늘의 이름 <b id="nick"></b><button id="renick" type="button">바꾸기</button></div>
   <label><input type="checkbox" id="soundOpt" checked> 파도 소리 켜기</label>
  </div>
  <button class="enter" id="enter" type="button">바다로 내려가기 <span>→</span></button>
 </div>
</div>

<div class="ui" id="ui" style="opacity:0">
 <div class="brand"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="17" cy="14" r="6"/><path d="M3 23c3-3 6-3 9 0s6 3 9 0 6-3 9 0M3 29c3-3 6-3 9 0s6 3 9 0 6-3 9 0"/></svg><div>물멍하는 곳<b>노을 바닷가</b></div></div>
 <div class="board" id="board" hidden></div>
 <div class="topright"><span id="count" class="count"></span><button class="iconbtn" id="sound" aria-pressed="true" title="파도 소리 켜기/끄기"><svg class="i" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></svg></button></div>
 <nav class="rail" aria-label="행동">
  <button data-act="gaze"><svg class="i" viewBox="0 0 24 24"><path d="M6 13a6 6 0 0 1 12 0"/><path d="M12 4v2M4.5 7.5l1.4 1.4M19.5 7.5l-1.4 1.4"/><path d="M2 17c2-2 4-2 6 0s4 2 6 0 4-2 6 0M2 21c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg><small>물멍</small></button>
  <button data-act="swim" id="swimBtn" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><circle cx="15" cy="7" r="2.5"/><path d="M3 12l5-5 4 4"/><path d="M2 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg><small>수영하기</small></button>
  <button data-act="skip"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="16" r="2.5"/><path d="M9 14c1.5-3 3-3 4.5 0M14 14c1.2-2.5 2.5-2.5 3.7 0M18 14c1-1.8 2-1.8 3 0" /><path d="M3 20c3-1.5 15-1.5 18 0"/></svg><small>물수제비</small></button>
  <button data-act="dip"><svg class="i" viewBox="0 0 24 24"><path d="M9 3c3 0 4 3 4 6 0 2-1 3-1 5 0 1.5 1 2.5 1 4a3 3 0 0 1-6 0c0-1.5 1-2.5 1-4 0-2-1-3-1-5 0-3 1-6 2-6z"/><path d="M2 21c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg><small>발 담그기</small></button>
  <button data-act="boat"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M12 4l7 10H12z"/><path d="M4 16h16l-2 4H6z"/></svg><small>소원배</small></button>
  <button data-act="breath"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" stroke-dasharray="2 3"/><circle cx="12" cy="12" r="10.5" stroke-dasharray="1 4"/></svg><small>심호흡</small></button>
 </nav>
 <div class="toast" id="toast"></div>
 <p class="hint">클릭·탭으로 걷기 · WASD / 방향키 이동 · 수영 중엔 WASD로 헤엄</p>
 <p class="links"><a id="coffee" target="_blank" rel="noopener" hidden>☕ 개발자에게 커피 한 잔</a><a id="feedback" target="_blank" rel="noopener" hidden>💬 의견 남기기</a></p>
</div>

<div class="ask" id="ask"><form id="wishForm"><h3>⛵ 소원배에 적을 한 줄</h3><input id="wishText" maxlength="30" placeholder="예: 올해는 가족 모두 건강하게" autocomplete="off" required><p>한 사람당 소원배는 하나예요 · 모두에게 보여요 · 30자까지</p><div class="btns"><button type="button" id="wishCancel">취소</button><button type="submit">바다에 띄우기</button></div></form></div>
<div class="breath" id="breath"><div class="circle" id="circle"></div><p id="btext">들이쉬기</p><small>아무 곳이나 누르면 돌아가요</small></div>

<script>
(()=>{
// 설정: 비워 두면 혼자 모드. 키는 공개용(publishable)만 넣는다
const CONFIG={
 supabaseUrl:'https://mlnbnfiwdishndmsjjtq.supabase.co',
 supabaseKey:'sb_publishable_cm1F-2OjWk6aW04IM-ctWQ_b6Q6LY9C', // 공개 배포용 키(브라우저 노출 전제). 비밀 키(secret/service_role)는 절대 여기 넣지 않는다
 coffeeUrl:'',     // 예: https://toss.me/아이디  (계좌번호 노출 없이 송금 받는 링크)
 feedbackUrl:''    // 예: 구글 폼 / 카카오 오픈채팅 링크
};
const $=s=>document.querySelector(s);
for(const [id,url] of [['coffee',CONFIG.coffeeUrl],['feedback',CONFIG.feedbackUrl]])if(url){$('#'+id).href=url;$('#'+id).hidden=false;}
const canvas=$('#c'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();

// 장면 구획(비율) — 하늘 / 바다 / 모래
const L=()=>({horizon:H*.42,shore:H*.72,bottom:H*.96});
// 하루: 4분에 한 바퀴, 실제 시계 기준이라 모두 같은 하늘을 봄. 0 새벽 → .3 한낮 → .6 노을 → .8 한밤 → 1 새벽. ?phase=0.3 으로 미리보기 가능
// 영상 촬영용: ?start=0.45&day=40 이면 노을(0.45)에서 시작해 40초에 하루가 돈다
const Q=new URLSearchParams(location.search),DAY=parseFloat(Q.get('day'))||240,phaseOverride=parseFloat(Q.get('phase')),startPhase=parseFloat(Q.get('start')),t0=performance.now();
const dayPhase=()=>isFinite(phaseOverride)?phaseOverride:isFinite(startPhase)?(startPhase+(performance.now()-t0)/1000/DAY)%1:(Date.now()/1000%DAY)/DAY;
const SKY=[[0,['#2b2550','#7a4f74','#e08a5a','#ffd59a']],[.3,['#3a7bd5','#6fb1e6','#a8d4f0','#dff0fa']],[.6,['#1b1a3a','#5a3a6e','#c86a4e','#f3b36a']],[.8,['#05070f','#0c1427','#132038','#1b2a44']],[1,['#2b2550','#7a4f74','#e08a5a','#ffd59a']]];
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function sky(p){let i=0;while(SKY[i+1][0]<p)i++;const [p0,a]=SKY[i],[p1,b]=SKY[i+1],t=(p-p0)/(p1-p0);return a.map((h,j)=>mix(hex(h),hex(b[j]),t));}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,p)=>a+(b-a)*p,pick=a=>a[Math.random()*a.length|0],rnd=Math.random;
// 원근: 수평선 쪽이 작고 아래쪽이 크다. 물가(shore)에서 두 구간이 .75로 이어짐
const depth=y=>{const l=L();return y<l.shore?.4+.35*clamp((y-l.horizon)/(l.shore-l.horizon),0,1):.75+.55*clamp((y-l.shore)/(l.bottom-l.shore),0,1)};
const swimTop=l=>l.horizon+(l.shore-l.horizon)*.35;
const clampGoal=(c,x,y)=>{const l=L();return{x:clamp(x,20,W-20),y:c.swim?clamp(y,swimTop(l),l.shore-4):clamp(y,l.shore+8,l.bottom)}};
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}

// 이름
const ADJ=['느긋한','다정한','고요한','포근한','잔잔한','맑은','수줍은','반짝이는'];
const ANI=['해달','갈매기','돌고래','소라게','불가사리','바다거북','멸치','파도'];
const makeNick=()=>pick(ADJ)+' '+pick(ANI);
let nick=makeNick();$('#nick').textContent=nick;
$('#renick').onclick=()=>{nick=makeNick();$('#nick').textContent=nick;};

// 배경 요소는 비율로만 저장해 창 크기가 바뀌어도 그대로
const stars=Array.from({length:70},()=>({fx:rnd(),fy:rnd()*.6,r:.4+rnd()*1,sp:.5+rnd()*2,ph:rnd()*7}));
const shimmer=Array.from({length:50},()=>({fx:rnd(),fy:rnd(),len:20+rnd()*60,sp:.3+rnd(),k:.5+rnd()*1.5,ph:rnd()*7}));
const grass=Array.from({length:16},()=>({fx:rnd()<.5?rnd()*.2:.8+rnd()*.2,fy:.55+rnd()*.45,h:24+rnd()*34,ph:rnd()*7}));

// 인물
const SAY=['오늘도 수고했어요','파도 소리가 참 좋네요','천천히 가도 괜찮아요','발이 시원해요','노을이 참 예쁘다','아무 생각 안 해도 돼요'];
function makeChar(name,fx,fy,hue,isNpc){const l=L();const c={name,x:W*fx,y:l.shore+(l.bottom-l.shore)*fy,hue,isNpc,state:'idle',t:0,face:1,sit:false,swim:false,timer:isNpc?2+rnd()*5:0,dip:0,dipT:0,rip:0,say:null,sayT:0,then:null};c.tx=c.x;c.ty=c.y;return c;}
const npcs=[makeChar('느긋한 해달',.18,.55,160,true),makeChar('고요한 돌고래',.45,0,200,true),makeChar('수줍은 소라게',.78,.7,20,true)];
npcs[2].sit=true;npcs[0].face=-1;
npcs[1].swim=true;npcs[1].y=npcs[1].ty=L().shore-(L().shore-L().horizon)*.3; // 처음부터 헤엄치는 친구
let player=null,gaze=false;
const ripples=[],stones=[],boats=[],particles=[],floaters=[],keys=new Set();
const mkRipple=(x,y,s=1)=>({x,y,r:2,a:.7,s});

// 소원배: 한 브라우저당 하나. 바다 위에 계속 떠 있고(최근 12개), 함께 모드면 DB에 저장돼 모두에게 보임
const WISHKEY='mulmeong.wish',CIDKEY='mulmeong.cid';
const store=(k,v)=>{try{v===undefined?0:localStorage.setItem(k,JSON.stringify(v));return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
let myWish=store(WISHKEY),clientId=store(CIDKEY)||store(CIDKEY,Math.random().toString(36).slice(2)+Date.now().toString(36));
// fromShore: 방금 띄운 배는 물가에서 출발해 해 쪽(수평선 가까이)으로 약 40초 떠내려간 뒤 그 자리에서 둥둥
function addWish(w,fromShore){if(!w||!w.id||boats.some(b=>b.id===w.id))return;const h=[...String(w.id)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
 const tx=.1+(h%1000)/1000*.8,ty=.1+((h>>10)%1000)/1000*.28;
 boats.push({id:w.id,name:String(w.name).slice(0,16),text:String(w.text).slice(0,30),fx:fromShore?clamp(+w.fx||.5,.05,.95):tx,fy:fromShore?1:ty,tx,ty,vx:((h>>20)&1?1:-1)*.004,ph:h%7});
 if(boats.length>12)boats.shift();}

// 함께 머물기: Supabase Realtime(무료 플랜) 채널로 위치만 주고받음. 서버 코드·DB 없음
const remotes={};let chan=null,db=null,joined=false,lastSend=0,lastSent='';
const toFrac=c=>{const l=L();return{fx:+(c.x/W).toFixed(4),fy:+((c.y-l.shore)/(l.bottom-l.shore)).toFixed(4)}};
async function connect(){if(!CONFIG.supabaseUrl||!CONFIG.supabaseKey)return;
 const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm');
 const me=player.id=Math.random().toString(36).slice(2,10);
 db=createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey);chan=db.channel('mulmeong',{config:{presence:{key:me}}});
 db.from('mulmeong_wishes').select('id,name,text').order('created_at',{ascending:false}).limit(12).then(({data,error})=>{if(error)console.warn('소원 불러오기 실패',error);(data||[]).reverse().forEach(addWish);});
 chan.on('presence',{event:'sync'},()=>{const st=chan.presenceState();$('#count').textContent='함께 '+Object.keys(st).length+'명';for(const id in remotes)if(!st[id])delete remotes[id];})
 // 다른 사람이 보낸 값은 믿지 않는다: 숫자 아니면 버리고, 범위를 자른다
 .on('broadcast',{event:'move'},({payload:p})=>{if(!p||p.id===me||typeof p.id!=='string')return;const fx=+p.fx,fy=+p.fy;if(!isFinite(fx)||!isFinite(fy))return;
  const l=L(),r=remotes[p.id]||(remotes[p.id]=makeChar(String(p.name||'누군가').slice(0,16),clamp(fx,0,1),clamp(fy,-1.2,1),(+p.hue||0)%360,true));
  r.name=String(p.name||'누군가').slice(0,16);r.hue=(+p.hue||0)%360;r.swim=!!p.swim;r.tx=clamp(fx,0,1)*W;r.ty=l.shore+(l.bottom-l.shore)*clamp(fy,-1.2,1);r.sit=!!p.sit;if(Math.abs(r.tx-r.x)<1.5)r.face=p.face<0?-1:1;})
 .on('broadcast',{event:'fx'},({payload:p})=>{const r=p&&remotes[p.id];if(!r)return;
  if(p.type==='stone'){throwStone(r,clamp(p.hops|0,1,9));r.skips=clamp(p.skips|0,0,99999);r.best=clamp(p.best|0,0,9);boardDirty=true;}})
 .on('broadcast',{event:'wish'},({payload:w})=>{if(w&&typeof w.id==='string'&&w.text)addWish(w,true);})
 .subscribe(async s=>{if(s==='SUBSCRIBED'){joined=true;await chan.track({name:player.name});sendMove(true);}else if(s==='CLOSED'||s==='CHANNEL_ERROR')joined=false;});}
function sendMove(force){if(!joined||!player.id)return;const now=performance.now(),p={id:player.id,name:player.name,hue:player.hue,sit:player.sit,swim:player.swim,face:player.face,...toFrac(player)},key=JSON.stringify(p);
 if(!force&&(key===lastSent?now-lastSend<5000:now-lastSend<250))return; // 움직일 때 초당 4번, 가만히 있으면 5초마다
 lastSend=now;lastSent=key;chan.send({type:'broadcast',event:'move',payload:p});}
function sendFx(type,extra){if(joined&&player.id)chan.send({type:'broadcast',event:'fx',payload:{id:player.id,type,...extra}});}

// 물수제비 순위판: 지금 이 바닷가에 있는 사람(나·NPC·함께 모드 접속자) 기준. 내 기록만 브라우저에 저장
let boardDirty=true;
const SAVE='mulmeong.skips';
function renderBoard(){boardDirty=false;const el=$('#board');el.hidden=!player;if(!player)return;el.replaceChildren();
 const h=document.createElement('h3');h.textContent='🏆 물수제비 순위 · 지금 바닷가에 있는 사람';el.append(h);const ol=document.createElement('ol');
 const top=[player,...npcs,...Object.values(remotes)].filter(c=>c.skips>0).sort((a,b)=>b.skips-a.skips).slice(0,3);
 top.forEach((c,i)=>{const li=document.createElement('li'),n=document.createElement('span');li.textContent=['🥇','🥈','🥉'][i]+' '+c.name;n.textContent=c.skips+'번';li.append(n);ol.append(li);});
 if(!top.length){const li=document.createElement('li');li.textContent='아직 아무도 안 던졌어요';ol.append(li);}
 const me=document.createElement('li'),b=document.createElement('span');me.className='me';me.textContent='나 · '+(player.skips||0)+'번';b.textContent=player.best?'최고 '+player.best+'번 튕김':'';me.append(b);ol.append(me);el.append(ol);}

function setGoal(c,x,y,then){const g=clampGoal(c,x,y);c.tx=g.x;c.ty=g.y;c.then=then||null;c.sit=false;}
// 튕기는 횟수는 1~9번 랜덤(적게 튕기는 쪽이 흔함). 많이 튕길수록 멀리, 오래 날아간다
function throwStone(c,hops){c.sit=false;c.state='throw';c.t=0;const l=L(),dir=c.face||1;hops=hops||1+(rnd()*rnd()*9|0);
 c.skips=(c.skips||0)+1;c.best=Math.max(c.best||0,hops);boardDirty=true;
 if(c===player)try{localStorage.setItem(SAVE,JSON.stringify({skips:c.skips,best:c.best}));}catch(e){}
 const sx=c.x,sy=c.swim?c.y:l.shore-2,ex=clamp(sx+dir*(60+hops*35)*(.8+rnd()*.4),20,W-20),ey=l.horizon+(l.shore-l.horizon)*clamp(.5-hops*.045,.1,.5);
 stones.push({sx,sy,ex,ey,p:0,hops,dur:.9+hops*.22,prev:0,owner:c});return hops;}
function splash(x,y,n){const l=L(),k=.35+clamp((y-l.horizon)/(l.shore-l.horizon),0,1)*.9;for(let i=0;i<n;i++)particles.push({x,y,vx:(rnd()-.5)*70*k,vy:-(40+rnd()*70)*k,a:.9,k});}
function stepChar(c,dt){const dx=c.tx-c.x,dy=c.ty-c.y,dist=Math.hypot(dx,dy);c.t+=dt;const l=L();
 if(dist>1.5){const sp=(c.swim?60:85)*depth(c.y)*dt,k=Math.min(1,sp/dist);c.x+=dx*k;c.y+=dy*k;c.face=dx<0?-1:1;c.state='walk';}
 else{if(c.state==='walk')c.state='idle';
  if(c.then==='dip'){c.sit=true;c.dip=7;c.dipT=0;if(c===player)splashSound(.8);}
  else if(c.then==='swim'){c.swim=true;c.y=c.ty=l.shore-8;ripples.push(mkRipple(c.x,c.y,1.2));if(c===player){splashSound(1);$('#swimBtn').setAttribute('aria-pressed',true);toast('WASD·방향키로 헤엄쳐요 · 모래 쪽으로 나오면 끝');}}
  else if(c.then==='land')landChar(c);
  c.then=null;}
 if(c.state==='throw'&&c.t>.5)c.state='idle';
 if(c.swim){c.rip-=dt;if(c.rip<=0){c.rip=c.state==='walk'?.35:1.6;ripples.push(mkRipple(c.x,c.y+2,.5));if(c===player&&c.state==='walk')splashSound(.45);}}
 if(c.dip>0){c.dip-=dt;c.dipT-=dt;if(c.dipT<=0){c.dipT=1.3;ripples.push(mkRipple(c.x,l.shore-3,.6));if(c===player)splashSound(.2);}}
 if(c.sayT>0){c.sayT-=dt;if(c.sayT<=0)c.say=null;}}
function landChar(c){c.swim=false;c.y=c.ty=L().shore+10;c.tx=c.x;if(c===player){splashSound(.7);$('#swimBtn').setAttribute('aria-pressed',false);}}
function npcThink(n,dt){n.timer-=dt;if(n.timer>0)return;n.timer=5+rnd()*9;const l=L(),r=rnd();
 if(n.swim){if(r<.7)setGoal(n,30+rnd()*(W-60),swimTop(l)+rnd()*(l.shore-4-swimTop(l)));else{n.say=pick(SAY);n.sayT=4.5;}return;}
 if(r<.4)setGoal(n,30+rnd()*(W-60),l.shore+8+rnd()*(l.bottom-l.shore-8));
 else if(r<.65)n.sit=!n.sit;
 else if(r<.85){n.say=pick(SAY);n.sayT=4.5;}
 else throwStone(n);}
function keyMove(c,dt){const k=s=>keys.has(s);
 const vx=(k('d')||k('arrowright'))-(k('a')||k('arrowleft')),vy=(k('s')||k('arrowdown'))-(k('w')||k('arrowup'));
 if(!vx&&!vy)return;exitGaze();const l=L(),sp=(c.swim?60:85)*depth(c.y)*dt,g=clampGoal(c,c.x+vx*sp,c.y+vy*sp*.7);
 if(c.swim&&vy>0&&g.y>=l.shore-4){landChar(c);return;} // 물가에서 아래로 누르면 모래로 올라옴
 c.x=c.tx=g.x;c.y=c.ty=g.y;if(vx)c.face=vx;c.state='walk';c.sit=false;c.then=null;}
function updateFX(dt){const l=L();
 for(let i=ripples.length;i--;){const r=ripples[i];r.r+=40*r.s*dt;r.a-=dt*.55;if(r.a<=0)ripples.splice(i,1);}
 for(let i=stones.length;i--;){const s=stones[i];s.p+=dt/s.dur;
  if(s.p>=1){ripples.push(mkRipple(s.ex,s.ey,1.2));splash(s.ex,s.ey,8);plop(.8);floaters.push({x:s.ex,y:s.ey-10,text:s.hops+'번!',a:1});
   if(s.owner===player)toast(s.hops+'번 튕겼어요!'+(s.hops>=player.best?' 최고 기록':''));stones.splice(i,1);continue;}
  const k=Math.floor(s.hops*s.p);if(k>s.prev){s.prev=k;const x=lerp(s.sx,s.ex,s.p),y=lerp(s.sy,s.ey,s.p);ripples.push(mkRipple(x,y,.9));splash(x,y,5);plop();}}
 for(let i=particles.length;i--;){const p=particles[i];p.vy+=220*p.k*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*1.6;if(p.a<=0)particles.splice(i,1);}
 for(let i=floaters.length;i--;){const f=floaters[i];f.y-=25*dt;f.a-=dt*.8;if(f.a<=0)floaters.splice(i,1);}
 for(const b of boats){const dx=b.tx-b.fx,dy=b.ty-b.fy,d=Math.hypot(dx,dy);
  if(d>.003){const s=Math.min(1,.02*dt/d);b.fx+=dx*s;b.fy+=dy*s;}
  else{b.fx+=b.vx*dt;if(b.fx<.08||b.fx>.92)b.vx*=-1;b.tx=b.fx;}}}

// 그리기
function drawScene(t){const l=L(),swell=Math.sin(t*.53),p=dayPhase(),S=sky(p);let g;
 // 해(p<.6)는 왼쪽에서 떠서 오른쪽으로 짐, 밤(p≥.6)엔 달이 같은 길을 감
 const isDay=p<.6,q=isDay?p/.6:(p-.6)/.4,arc=Math.sin(Math.PI*q),dl=isDay?Math.min(1,arc*1.4):0;
 const bx=W*(.12+.76*q),by=l.horizon+8-arc*(l.horizon-50),warm=1-Math.min(1,arc*1.3);
 const sunC=mix([255,246,214],[255,200,110],warm),moonC=[246,231,191],lightC=isDay?sunC:moonC;
 // 하늘
 g=ctx.createLinearGradient(0,0,0,l.horizon);g.addColorStop(0,rgb(S[0]));g.addColorStop(.45,rgb(S[1]));g.addColorStop(.8,rgb(S[2]));g.addColorStop(1,rgb(S[3]));ctx.fillStyle=g;ctx.fillRect(0,0,W,l.horizon+2);
 ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=(.2+.5*Math.abs(Math.sin(t*s.sp+s.ph)))*(1-s.fy)*(1-dl);ctx.beginPath();ctx.arc(s.fx*W,s.fy*l.horizon,s.r,0,7);ctx.fill();}ctx.globalAlpha=1;
 g=ctx.createRadialGradient(bx,by,10,bx,by,isDay?240:140);g.addColorStop(0,rgb(lightC,isDay?.45:.3));g.addColorStop(1,rgb(lightC,0));ctx.fillStyle=g;ctx.fillRect(0,0,W,l.horizon);
 ctx.fillStyle=rgb(lightC);ctx.beginPath();ctx.arc(bx,by,isDay?42-14*arc:26,0,7);ctx.fill();
 // 멀리 섬
 ctx.fillStyle=rgb(mix([58,42,78],S[2],.25*dl));ctx.beginPath();ctx.moveTo(0,l.horizon);for(let x=0;x<=W*.32;x+=10)ctx.lineTo(x,l.horizon-16*Math.sin(x/(W*.32)*Math.PI)-6*Math.sin(x/W*40));ctx.lineTo(W*.32,l.horizon);ctx.closePath();ctx.fill();
 // 바다: 수평선 쪽은 하늘색을 받고, 밤엔 어두워짐
 const k=.45+.55*dl;g=ctx.createLinearGradient(0,l.horizon,0,l.shore);g.addColorStop(0,rgb(mix(S[2],[74,90,134],.45)));g.addColorStop(.25,rgb(mix([30,40,70],[74,120,170],dl)));g.addColorStop(1,rgb([31*k,58*k,92*k]));ctx.fillStyle=g;ctx.fillRect(0,l.horizon,W,l.shore-l.horizon+2);
 // 해·달 비친 길: 수평선 가까울수록 길고 또렷
 ctx.strokeStyle=rgb(lightC,.7);const refl=isDay?1-arc*.75:.8;
 for(let i=0;i<26;i++){const pp=i/26,y=l.horizon+6+pp*(l.shore-l.horizon-10),wob=Math.sin(t*1.3+i*1.7)*(6+pp*18),len=(16+pp*80)*(.6+.4*Math.sin(t*.9+i));
  ctx.globalAlpha=(.25+.4*(1-pp)*Math.abs(Math.sin(t*.8+i*.9)))*refl;ctx.lineWidth=1+pp*2;ctx.beginPath();ctx.moveTo(bx+wob-len/2,y);ctx.lineTo(bx+wob+len/2,y);ctx.stroke();}
 ctx.strokeStyle='rgba(200,220,245,.5)';ctx.lineWidth=1;
 for(const s of shimmer){const y=l.horizon+s.fy*(l.shore-l.horizon),x=((s.fx*W+t*s.sp*20)%(W+80))-40;ctx.globalAlpha=(.08+.14*Math.abs(Math.sin(t*s.k+s.ph)))*(.5+.5*dl);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s.len*(.4+s.fy),y);ctx.stroke();}
 // 밀려오는 파도 마루
 ctx.strokeStyle='#e9f1ff';
 for(let i=0;i<5;i++){const pp=(t*.045+i/5)%1,y=l.horizon+pp*(l.shore-l.horizon);ctx.globalAlpha=(.06+.4*pp*pp)*(.6+.4*dl);ctx.lineWidth=.5+2.5*pp;ctx.beginPath();
  for(let x=0;x<=W;x+=16)ctx.lineTo(x,y+Math.sin(x/W*14+t*1.5+i)*3*pp);ctx.stroke();}
 ctx.globalAlpha=1;
 // 모래(밤엔 어둡게)
 const sk=.45+.55*dl;g=ctx.createLinearGradient(0,l.shore,0,H);g.addColorStop(0,rgb([138*sk+20,106*sk+14,82*sk+10]));g.addColorStop(1,rgb([74*sk,58*sk,48*sk]));ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,l.shore+10);
 for(let x=0;x<=W;x+=20)ctx.lineTo(x,l.shore+4*Math.sin(x/W*9+2)+3*Math.sin(x/W*23));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
 // 젖은 모래 + 거품 선(밀물·썰물처럼 오르내림)
 g=ctx.createLinearGradient(0,l.shore,0,l.shore+26);g.addColorStop(0,'rgba(255,210,170,.25)');g.addColorStop(1,'rgba(255,210,170,0)');ctx.fillStyle=g;ctx.fillRect(0,l.shore,W,26);
 for(const [off,a,w] of [[swell*5,.55,3],[8+swell*4,.2,1.5]]){ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=w;ctx.beginPath();
  for(let x=0;x<=W;x+=14)ctx.lineTo(x,l.shore+off+4*Math.sin(x/W*9+2)+3*Math.sin(x/W*23)+2*Math.sin(x/W*60+t*2));ctx.stroke();}
 // 모래 언덕 풀
 ctx.strokeStyle=rgb([79*sk+10,90*sk+10,58*sk+6]);ctx.lineWidth=2;
 for(const r of grass){const x=r.fx*W,y=l.shore+(l.bottom-l.shore)*r.fy,sw=Math.sin(t*1.1+r.ph)*4;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+sw,y-r.h*.6,x+sw*1.8,y-r.h);ctx.stroke();}}
function drawRipple(r){const l=L(),k=.35+clamp((r.y-l.horizon)/(l.shore-l.horizon),0,1)*.9;ctx.strokeStyle=`rgba(220,235,255,${r.a})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r*k,r.r*k*.32,0,0,7);ctx.stroke();}
function drawStone(s){const x=lerp(s.sx,s.ex,s.p),y=lerp(s.sy,s.ey,s.p),h=Math.abs(Math.sin(Math.PI*s.hops*s.p))*(26*(1-s.p)+3);ctx.fillStyle='#9aa3ad';ctx.beginPath();ctx.arc(x,y-h,3,0,7);ctx.fill();}
function drawFX(){for(const p of particles){ctx.fillStyle=`rgba(225,240,255,${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,1.6*p.k,0,7);ctx.fill();}

 for(const f of floaters){ctx.fillStyle=`rgba(20,10,30,${f.a*.6})`;ctx.fillText(f.text,f.x+1,f.y+1);ctx.fillStyle=`rgba(255,244,234,${f.a})`;ctx.fillText(f.text,f.x,f.y);}}
function drawBoat(b,t){const l=L(),x=b.fx*W,y=l.horizon+(l.shore-l.horizon)*b.fy,sc=.45+.55*b.fy;
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${Math.round(9+4*b.fy)}px sans-serif`;const label=`“${b.text}” · ${b.name}`,tw=ctx.measureText(label).width+14,ly=y-24*sc-10;
 ctx.fillStyle='rgba(20,10,30,.5)';rr(x-tw/2,ly-9,tw,18,9);ctx.fill();ctx.fillStyle='rgba(255,244,234,.9)';ctx.fillText(label,x,ly);
 ctx.save();ctx.translate(x,y+Math.sin(t*2+b.ph)*1.5);ctx.scale(sc,sc);
 let g=ctx.createRadialGradient(0,-4,2,0,-4,30);g.addColorStop(0,'rgba(255,200,120,.55)');g.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=g;ctx.fillRect(-30,-34,60,60);
 ctx.fillStyle='rgba(255,200,120,.18)';ctx.beginPath();ctx.ellipse(0,6,10,3,0,0,7);ctx.fill();
 ctx.fillStyle='#fff3e0';ctx.beginPath();ctx.moveTo(-10,-3);ctx.lineTo(10,-3);ctx.lineTo(6,3);ctx.lineTo(-6,3);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(0,-3);ctx.lineTo(0,-14);ctx.lineTo(7,-4);ctx.closePath();ctx.fill();
 ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(0,-5,1.8,0,7);ctx.fill();ctx.restore();}
function drawChar(c,t){const d=depth(c.y),s=d*Math.max(9,H/60),body=`hsl(${c.hue} 45% 58%)`,skin='#f3d2b4';let x=c.x,y=c.y,hy;

  y+=Math.sin(t*2+c.x)*1.5;ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(x,y+2,s*1.6,s*.5,0,0,7);ctx.fill();

 else{const bob=c.state==='walk'?Math.abs(Math.sin(t*9))*2*d:0;y-=bob;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(c.x,c.y+2,s*1.3,s*.45,0,0,7);ctx.fill();
  if(c.sit){ctx.fillStyle=body;rr(x-s*.9,y-s*1.9,s*1.8,s*1.7,s*.6);ctx.fill();ctx.fillStyle='#3a3344';rr(x-s*.9+(c.face>0?s*.5:0),y-s*.5,s*1.3,s*.5,s*.25);ctx.fill();hy=y-s*2.5;}
  else{ctx.fillStyle='#3a3344';rr(x-s*.7,y-s*1.2,s*1.4,s*1.2,s*.3);ctx.fill();ctx.fillStyle=body;rr(x-s*.9,y-s*3,s*1.8,s*2,s*.6);ctx.fill();hy=y-s*3.6;
   if(c.state==='throw'){ctx.strokeStyle=skin;ctx.lineWidth=s*.35;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+c.face*s*.8,y-s*2.6);ctx.lineTo(x+c.face*s*1.6,y-s*3.6);ctx.stroke();}}}
 ctx.fillStyle=skin;ctx.beginPath();ctx.arc(x,hy,s*.9,0,7);ctx.fill();
 ctx.fillStyle='#2b2320';ctx.beginPath();ctx.arc(x+c.face*s*.3,hy,s*.1,0,7);ctx.arc(x+c.face*s*.6,hy,s*.1,0,7);ctx.fill();
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${Math.max(10,11*d)}px sans-serif`;const ly=hy-s*1.6;let tw=ctx.measureText(c.name).width+14;
 ctx.fillStyle='rgba(20,10,30,.55)';rr(x-tw/2,ly-9,tw,18,9);ctx.fill();ctx.fillStyle=c.isNpc?'rgba(255,244,234,.8)':'#ffb98f';ctx.fillText(c.name,x,ly);
 if(c.say){ctx.font='12px sans-serif';tw=ctx.measureText(c.say).width+20;ctx.fillStyle='rgba(255,244,234,.93)';rr(x-tw/2,ly-36,tw,24,12);ctx.fill();ctx.fillStyle='#2b1f2e';ctx.fillText(c.say,x,ly-24);}}

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
 for(const n of npcs){npcThink(n,dt);stepChar(n,dt);}
 if(player){stepChar(player,dt);keyMove(player,dt);sendMove();}
 for(const id in remotes)stepChar(remotes[id],dt);
 updateFX(dt);drawScene(t);
 for(const b of boats)drawBoat(b,t);for(const r of ripples)drawRipple(r);for(const s of stones)drawStone(s);
 const chars=[...npcs,...Object.values(remotes)];if(player)chars.push(player);chars.sort((a,b)=>a.y-b.y);for(const c of chars)drawChar(c,t);
 drawFX();if(boardDirty)renderBoard();
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// 소리: 파일 없이 브라우저가 직접 합성(무료·저작권 걱정 없음). 약 12초마다 한 번씩 밀려왔다 빠지는 파도
let AC,master,whiteBuf,enabled=true;
function noise(brown){const b=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d=b.getChannelData(0);let l=0;
 for(let i=0;i<d.length;i++){const w=rnd()*2-1;if(brown){l=(l+.02*w)/1.02;d[i]=l*3.5;}else d[i]=w;}return b;}
function startAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
 const swellHz=.085;
 const layer=(buf,type,freq,q,base,depthAmt,delay)=>{const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain();g.gain.value=base;src.connect(f).connect(g).connect(master);src.start();
  if(depthAmt){const lfo=AC.createOscillator();lfo.frequency.value=swellHz;const lg=AC.createGain();lg.gain.value=depthAmt;lfo.connect(lg).connect(g.gain);lfo.start(AC.currentTime+delay);}};
 whiteBuf=noise(false);
 layer(noise(true),'lowpass',420,.6,.55,.45,0);    // 밀려오는 파도(저음)
 layer(whiteBuf,'bandpass',2200,.7,.07,.06,1.8);   // 부서지는 거품(고음), 조금 늦게 따라옴
 layer(whiteBuf,'highpass',5000,.7,.012,0,0);      // 바닷바람
 setAudio(enabled);}
// 첨벙 = 낮은 "첨"(둔탁한 울림) + 물 튀는 잡음(높은 데서 낮은 데로) + 물방울 "벙"(짧은 고음 몇 개). 파도 소리보다 크게
function splashSound(v=1){if(!AC||!enabled)return;const n=AC.currentTime;
 const src=AC.createBufferSource();src.buffer=whiteBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=.6;f.frequency.setValueAtTime(3200,n);f.frequency.exponentialRampToValueAtTime(500,n+.28);
 const g=AC.createGain();g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(1.6*v,n+.015);g.gain.exponentialRampToValueAtTime(.001,n+.45);src.connect(f).connect(g).connect(master);src.start(n,rnd()*2);src.stop(n+.5);
 const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.setValueAtTime(190,n);o.frequency.exponentialRampToValueAtTime(55,n+.25);og.gain.setValueAtTime(.9*v,n);og.gain.exponentialRampToValueAtTime(.001,n+.3);o.connect(og).connect(master);o.start(n);o.stop(n+.32);
 for(let i=0,k=2+(rnd()*3|0);i<k;i++){const d=AC.createOscillator(),dg=AC.createGain(),t0=n+.06+rnd()*.3,fq=700+rnd()*1100;d.type='sine';d.frequency.setValueAtTime(fq,t0);d.frequency.exponentialRampToValueAtTime(fq*.6,t0+.08);
  dg.gain.setValueAtTime(.0001,t0);dg.gain.exponentialRampToValueAtTime(.45*v,t0+.008);dg.gain.exponentialRampToValueAtTime(.001,t0+.1);d.connect(dg).connect(master);d.start(t0);d.stop(t0+.12);}}
function setAudio(on){enabled=on;$('#sound').setAttribute('aria-pressed',on);if(!AC)return;if(on)AC.resume();master.gain.setTargetAtTime(on?.4:0,AC.currentTime,.8);}
function plop(pitch=1){if(!AC||!enabled)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type='sine';o.frequency.setValueAtTime(520*pitch,n);o.frequency.exponentialRampToValueAtTime(140*pitch,n+.14);
 g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.001,n+.2);o.connect(g).connect(master);o.start();o.stop(n+.22);}

// 입력·행동
let toastT,gazeT,bT;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2800);}
function enterGaze(){gaze=true;if(!player.swim)player.sit=true;player.tx=player.x;player.ty=player.y;player.then=null;toast('아무것도 하지 않아도 괜찮아요');clearTimeout(gazeT);gazeT=setTimeout(()=>{if(gaze)$('#ui').style.opacity=.15;},2500);}
function exitGaze(){if(!gaze)return;gaze=false;player.sit=false;clearTimeout(gazeT);$('#ui').style.opacity=1;}
const breath=$('#breath'),circle=$('#circle'),btext=$('#btext');
function startBreath(){clearTimeout(bT);breath.classList.add('on');const ph=[['들이쉬기',4,1],['잠시 멈추기',4,1],['내쉬기',6,.6]];let i=0;
 const go=()=>{const [txt,sec,sc]=ph[i++%3];btext.textContent=txt;circle.style.transitionDuration=sec+'s';circle.style.transform=`scale(${sc})`;bT=setTimeout(go,sec*1000);};
 circle.style.transitionDuration='0s';circle.style.transform='scale(.6)';requestAnimationFrame(()=>requestAnimationFrame(go));}
breath.onclick=()=>{breath.classList.remove('on');clearTimeout(bT);};
const ask=$('#ask');
$('#wishCancel').onclick=()=>ask.classList.remove('on');
$('#wishForm').onsubmit=async e=>{e.preventDefault();const text=$('#wishText').value.trim().slice(0,30);if(!text)return;ask.classList.remove('on');
 const w={id:(player.id||'local')+'-'+Date.now().toString(36),client_id:clientId,name:player.name.slice(0,16),text},fx=+(player.x/W).toFixed(3);
 addWish({...w,fx},true);myWish=store(WISHKEY,w);toast('소원배가 해 쪽으로 떠내려가요');plop();
 if(db){const {error}=await db.from('mulmeong_wishes').insert(w);if(error)console.warn('소원 저장 실패',error);else if(joined)chan.send({type:'broadcast',event:'wish',payload:{id:w.id,name:w.name,text:w.text,fx}});}};

canvas.addEventListener('pointerdown',e=>{if(!player)return;if(gaze){exitGaze();return;}const l=L();
 if(player.swim&&e.clientY>l.shore)setGoal(player,e.clientX,l.shore-4,'land');else setGoal(player,e.clientX,e.clientY);});
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
$('.rail').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!player)return;const a=b.dataset.act;if(a!=='gaze')exitGaze();
 if(a==='gaze')enterGaze();
 else if(a==='swim'){if(player.swim){setGoal(player,player.x,L().shore-4,'land');toast('모래로 올라와요');}else{setGoal(player,player.x,L().shore+8,'swim');toast('물가로 가서 바다에 들어가요');}}
 else if(a==='skip'){if(stones.some(s=>s.owner===player)){toast('돌이 아직 날아가고 있어요');return;}const hops=throwStone(player);sendFx('stone',{hops,skips:player.skips,best:player.best});}
 else if(a==='dip'){if(player.swim)landChar(player);setGoal(player,player.x,L().shore+8,'dip');toast('물가로 가서 발을 담가요');}
 else if(a==='boat'){if(myWish){toast(`소원배는 한 사람당 하나예요 · 내 소원: “${myWish.text}”`);return;}$('#wishText').value='';ask.classList.add('on');setTimeout(()=>$('#wishText').focus(),50);}
 else if(a==='breath')startBreath();});
$('#enter').onclick=()=>{player=makeChar(nick,.5,.75,15,false);$('#gate').classList.add('off');$('#ui').style.opacity=1;
 try{const s=JSON.parse(localStorage.getItem(SAVE));if(s){player.skips=s.skips|0;player.best=s.best|0;}}catch(e){}boardDirty=true;if(myWish)addWish(myWish);
 if($('#soundOpt').checked)startAudio();else setAudio(false);toast(`${nick}님, 천천히 머물다 가세요`);connect().catch(e=>console.warn('함께 모드 연결 실패, 혼자 모드로 계속',e));};
$('#sound').onclick=()=>{if(!AC)startAudio();setAudio(!enabled);};

// ?selftest 로 열면 순수 계산 부분을 점검
if(location.search.includes('selftest')){const a=(c,m)=>{if(!c)throw new Error('selftest 실패: '+m);};const l=L();
 a(makeNick().split(' ').length===2,'이름');
 const g=clampGoal({swim:false},10,-50);a(g.x===20&&g.y===l.shore+8,'걷기 목표 보정');
 const s=clampGoal({swim:true},W+99,H);a(s.x===W-20&&s.y===l.shore-4,'수영 목표 보정');
 a(depth(l.shore)===.75&&Math.abs(depth(l.shore-1e-6)-.75)<1e-3&&depth(0)===.4&&Math.abs(depth(H)-1.3)<1e-9,'원근 크기 연속');
 console.log('selftest ok');}
